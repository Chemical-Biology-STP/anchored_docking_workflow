[workspace]
channels = ["conda-forge", "https://conda.anaconda.org/hcc"]
name = "anchored_docking_workflow"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
dock = "python dock_cli.py"

[activation.env]
PATH = "$CONDA_PREFIX/bin:$PWD/scripts:$PATH"

[dependencies]
rdkit = ">=2026.9.1,<2027"
meeko = ">=0.8.0,<0.9"
python = ">=3.9"
autogrid = ">=4.2.9,<5"
gemmi = ">=0.7.5,<0.8"
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
pdb2pqr = ">=3.8.0,<4"
propka = ">=3.5.1,<4"
pyyaml = ">=6.0.3,<7"

# ADFRsuite (prepare_receptor) ships its own Python 2.7 and overwrites `python`
# in the environment's bin/, so it lives in a separate environment.
# Install it with `pixi install --all`.
[feature.adfr.dependencies]
adfr-suite = ">=1.0,<2"

# Tests for the interactive CLI: `pixi run -e dev test`
[feature.dev.dependencies]
pytest = ">=8"

[feature.dev.tasks]
test = "pytest test -q"

[environments]
adfr = { features = ["adfr"], no-default-feature = true }
dev = { features = ["dev"] }
